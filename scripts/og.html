<!doctype html>
<!-- Source of public/og.png (1200x630) and the GitHub social preview (1280x640). Render:
     google-chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 --virtual-time-budget=8000 --window-size=1200,630 --screenshot=public/og.png file://$PWD/scripts/og.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root { --bg: #0e0b09; --ink: #e9dcc3; --muted: #8b7b64; --dim: #4a3f33; --gold: #d9a441; --left: #6fb1e6; --right: #e2735c; --display: 'Cinzel', Georgia, serif; --body: 'Crimson Pro', Georgia, serif; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--body); }
body { background: radial-gradient(ellipse at 50% 30%, #1f1813 0%, var(--bg) 72%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; }
.crown svg { width: 84px; height: 84px; display: block; margin: 0 auto 6px; }
.title { font-family: var(--display); font-weight: 700; font-size: 92px; letter-spacing: .3em; padding-left: .3em; color: var(--gold); text-transform: uppercase; text-align: center; line-height: 1; }
.tag { font-style: italic; font-size: 38px; color: var(--muted); text-align: center; margin-top: 18px; }
.row { display: grid; grid-template-columns: 1fr 700px 1fr; align-items: center; gap: 28px; width: 1136px; }
.option { font-family: var(--display); font-size: 27px; line-height: 1.25; letter-spacing: .06em; }
.option.left { text-align: right; color: var(--left); }
.option.right { text-align: left; color: var(--right); }
.card { background: linear-gradient(165deg, #f1e3c4 0%, #e2cea4 100%); color: #2a2116; padding: 34px 42px; box-shadow: 0 30px 50px rgba(0,0,0,.6), inset 0 0 0 1px rgba(0,0,0,.1), inset 0 0 0 6px #ead9b6, inset 0 0 0 7px rgba(0,0,0,.15); transform: rotate(-1.2deg); }
.speaker { font-family: var(--display); font-size: 19px; letter-spacing: .2em; text-transform: uppercase; color: #6b5637; margin-bottom: 10px; }
.message { margin: 0; font-size: 37px; line-height: 1.3; }
.decide { width: 700px; }
.bar { position: relative; height: 8px; background: var(--right); }
.fill { position: absolute; inset: 0 auto 0 0; width: 28%; background: var(--left); }
.mid { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--ink); opacity: .5; }
.readout { font-family: var(--display); font-size: 19px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); text-align: center; margin-top: 10px; }
</style>
</head>
<body>
  <div class="crown">
    <svg viewBox="0 0 32 32"><path d="M4 24h24l-2-14-6 6-4-9-4 9-6-6z" fill="#d9a441"/></svg>
    <div class="title">Dethrone</div>
    <div class="tag">The model is king. You are the court.</div>
  </div>
  <div class="row">
    <div class="option left">Dismiss the general</div>
    <div class="card">
      <div class="speaker">The General</div>
      <p class="message">The army loves you, Sire. They chant your name. They also chant mine, but quieter.</p>
    </div>
    <div class="option right">Keep him</div>
  </div>
  <div class="decide">
    <div class="bar"><div class="fill"></div><div class="mid"></div></div>
    <div class="readout">Chosen at 72% · roll 71</div>
  </div>
</body>
</html>
